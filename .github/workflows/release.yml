# Builds and publishes a jdk release. A tag push (`v*`) runs the full CI gates
# at the tagged commit, builds and packages the artifacts, signs them (an SSHSIG
# over SHA256SUMS with the key `jdk update` has pinned, plus SLSA
# build-provenance attestations), publishes a GitHub release and then the
# crates.io crates (jdk-resolve, jdk-core, jdk, in dependency order — needs the
# CARGO_REGISTRY_TOKEN secret); a manual run is a dry-run that runs the same
# gates and uploads the same artifacts as workflow artifacts (unsigned), so the
# pipeline can be exercised without cutting a release.
#
# Five jobs, and the split between the middle two is the point (CI-12): `build`
# runs cargo — meaning it runs every build script in the dependency tree — and
# holds nothing but read access, while `release` holds the OIDC token that mints
# provenance and the write access that publishes, and runs no build at all. It
# takes the artifact `build` produced. Provenance signed in the same job that
# compiled the subject is L2 wearing L3's label.
#
# `publish-crates` compiles too — `cargo publish` runs a verification build —
# and it holds the crates.io token while doing so. That one is not separable:
# the token has to be present for the upload the build precedes. What stands in
# for the split there is `environment: release`, which is why it is declared.
#
# `winget` opens the pull request that carries the new version to the Windows
# Package Manager Community Repository. It is a sibling of `publish-crates`,
# not a successor: neither can invalidate the other, and a winget-pkgs outage
# has no business holding up crates.io. It runs with no repository permissions
# at all — everything it reads is public — and skips itself when the token it
# would submit with is absent, which is also the state before the package has
# been submitted by hand for the first time.
#
# Two signatures, two questions, no overlap (CI-11): the SSHSIG answers "is this
# the release the maintainer cut", which a client can check offline against a
# compiled-in key, and the attestations answer "was it built here, from this
# source". SHA256SUMS is what the first one covers, and every asset's hash is in
# it.
#
# Advisory scanning is not here: ci.yml's `deny` job covers the same RustSec
# database for every gate run, this one included (CI-10). `cargo auditable`
# stays — embedding the SBOM in jdk.exe is a different job from checking it.
#
# Everything that touches a zip runs on Windows: the shim, the Defender scan and
# the zips are all Windows-native. aarch64 is best-effort (continue-on-error)
# and never blocks the x64 release.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege: the default token can only read. Exactly one job elevates,
# and it is the one that neither compiles nor executes anything from the
# dependency tree.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt, clippy, the test suite, the MSRV check and cargo deny, run at the
  # tagged commit before anything is built or uploaded. Until now the tag
  # inherited no verification at all: ci.yml never triggered on tags, so
  # publishing rested on the maintainer having pushed master first — a
  # convention in RELEASING.md, not something the pipeline enforced.
  #
  # Calling ci.yml instead of copying its jobs here is what keeps the two
  # honest. The alternative, ci.yml triggering on `push: tags`, cannot gate
  # anything: Actions has no cross-workflow `needs`, and `workflow_run` fires
  # after the fact in the default branch's context, so the release would still
  # start regardless of the result.
  gates:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Compiles and packages. Inherits the workflow's read-only token and asks for
  # nothing more, so a build script anywhere in the tree finds no OIDC token and
  # no write access in its environment.
  build:
    needs: gates
    runs-on: windows-2025
    outputs:
      version: ${{ steps.meta.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # rust-toolchain.toml pins the toolchain and lists the aarch64 target;
      # rustup auto-installs both on the first cargo call.

      # cargo-auditable embeds the dependency SBOM in jdk.exe, so what shipped
      # can be matched against an advisory later, off this pipeline entirely.
      - name: install cargo-auditable
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2
        with:
          tool: cargo-auditable

      - name: resolve release version
        id: meta
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -ne $cargo) {
              throw "tag v$version does not match Cargo.toml workspace version $cargo - bump Cargo.toml or retag"
            }
          } else {
            # dry-run: the workspace version is the single source of truth.
            $version = $cargo
          }
          # A release must be described: fail early (dry-run included) if the
          # CHANGELOG has no section for this version.
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$version\]" -Quiet)) {
            throw "CHANGELOG.md has no '## [$version]' section - add release notes for $version before releasing"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Write-Host "release version: $version"

      # Pre-flight for the crates.io publish at the end of the run: packages the
      # three crates and runs their verification builds while failing is still
      # free. An upload cannot be taken back — a jdk-core that fails to package
      # after jdk-resolve is already on crates.io leaves the version half
      # published, and the only way out is to burn the number.
      #
      # Before the artifacts are assembled on purpose: `cargo publish` refuses a
      # dirty working tree, and `dist/` is not ignored.
      - name: publish dry-run (same command the publish job runs)
        run: cargo publish --dry-run --locked -p jdk-resolve -p jdk-core -p jdk

      # --locked on every build: the committed Cargo.lock is what the `deny`
      # gate judged, and a build free to resolve something newer would embed an
      # SBOM — and have a release signed — for a dependency graph no gate saw.
      - name: build jdk.exe (x64, SBOM embedded)
        run: cargo auditable build --locked --release -p jdk --bin jdk

      - name: build jdk-shim.exe (x64, size profile)
        run: cargo build --locked --profile release-shim -p jdk-shim --bin jdk-shim

      - name: shim size gate (< 1 MiB)
        run: |
          $shim = Get-Item target/release-shim/jdk-shim.exe
          Write-Host "jdk-shim.exe: $($shim.Length) bytes"
          if ($shim.Length -ge 1MB) { throw "jdk-shim.exe is $($shim.Length) bytes, gate is < 1 MiB" }

      - name: build aarch64 (best-effort)
        id: arm64
        continue-on-error: true
        run: |
          cargo auditable build --locked --release -p jdk --bin jdk --target aarch64-pc-windows-msvc
          cargo build --locked --profile release-shim -p jdk-shim --bin jdk-shim --target aarch64-pc-windows-msvc

      # Each zip carries jdk.exe, jdk-shim.exe side by side (what `jdk setup`
      # needs) plus LICENSE and README.md. A `<file>.sha256` sidecar
      # (`<hash>  <name>`, lowercase — what install.ps1 reads) accompanies every
      # artifact, install.ps1 and the scoop manifest included.
      - name: assemble release artifacts
        env:
          # Through the environment, not interpolated into the script text:
          # a `${{ }}` expansion is pasted in before pwsh parses the line, so
          # its content would be code rather than data.
          VERSION: ${{ steps.meta.outputs.version }}
          # Read-only, and scoped to this step rather than the job: the cargo
          # steps above run every build script in the dependency tree and none
          # of them shares an environment with this. It buys one API call, to
          # compare this release's architectures against the last one's.
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:VERSION
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          function New-Bundle([string]$Arch, [string]$JdkExe, [string]$ShimExe) {
            if (-not (Test-Path $JdkExe) -or -not (Test-Path $ShimExe)) {
              Write-Host "skip $Arch - binaries not present (best-effort build did not produce them)"
              return
            }
            $stage = Join-Path $env:RUNNER_TEMP "stage-$Arch"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item $JdkExe  (Join-Path $stage 'jdk.exe')
            Copy-Item $ShimExe (Join-Path $stage 'jdk-shim.exe')
            Copy-Item LICENSE, README.md $stage
            $zip = Join-Path $dist "jdk-v$version-windows-$Arch.zip"
            Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
            Write-Host "packaged $zip"
          }

          New-Bundle 'x64'   'target/release/jdk.exe'                          'target/release-shim/jdk-shim.exe'
          New-Bundle 'arm64' 'target/aarch64-pc-windows-msvc/release/jdk.exe'  'target/aarch64-pc-windows-msvc/release-shim/jdk-shim.exe'

          # An arm64 zip the previous release had and this one does not shrinks
          # the supported matrix under people already running arm64. A warning
          # and not a throw: whether a missing aarch64 build should stop a
          # release is UX-12's question, and deciding it here would decide it by
          # accident. `latest` is the PREVIOUS release only on a tag's first
          # run - re-run this workflow once the release exists and the
          # comparison is against itself.
          if (-not (Test-Path (Join-Path $dist "jdk-v$version-windows-arm64.zip"))) {
            try {
              $previous = Invoke-RestMethod -UseBasicParsing -Headers @{
                Authorization = "Bearer $env:GH_TOKEN"
                'User-Agent'  = 'jdk-release'
              } -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
              if ($previous.assets.name -match 'windows-arm64\.zip$') {
                Write-Host "::warning::$($previous.tag_name) shipped an arm64 zip and this build did not - the supported matrix just shrank under everyone already on arm64. Windows 11 on ARM64 falls back to the x64 build under emulation; Windows 10 on ARM64 has no such fallback, and scoop removes the installed version before it validates the new one, with no rollback. Nothing downstream is waiting on this warning - cancel the run now if the missing arm64 build was not intended, because the next job publishes."
              }
            } catch {
              # Never fatal. This step exists to describe the release, not to
              # gate it on the availability of an API.
              Write-Host "::notice::could not read the previous release to compare architectures: $($_.Exception.Message)"
            }
          }

          Copy-Item install.ps1 $dist

          # Per-file sidecar (install.ps1's fallback when ssh-keygen is absent)
          # plus one aggregate SHA256SUMS — the file the release job signs, and
          # the only thing `jdk update` trusts.
          $hashes = [ordered]@{}
          function Add-Sidecar([IO.FileInfo]$File) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $File.FullName).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$($File.FullName).sha256", "$hash  $($File.Name)`n")
            $hashes[$File.Name] = $hash
          }
          $artifacts = Get-ChildItem $dist -File | Where-Object { $_.Extension -ne '.sha256' }
          foreach ($f in $artifacts) { Add-Sidecar $f }

          # The scoop manifest quotes the zips' hashes, so it is written once
          # they are known and hashed in its turn: it ships as an asset of the
          # release it describes, which is what makes `scoop install
          # <latest/download/jdk.json>` and `scoop update` work with no bucket
          # to maintain, and SHA256SUMS covers it like everything else. An
          # absent arm64 zip leaves $null here, and the renderer drops that
          # architecture rather than quoting a hash for a file nobody built.
          $scoop = Join-Path $dist 'jdk.json'
          ./packaging/scoop/render.ps1 -Version $version -OutFile $scoop `
            -X64Sha256 $hashes["jdk-v$version-windows-x64.zip"] `
            -Arm64Sha256 $hashes["jdk-v$version-windows-arm64.zip"]
          Add-Sidecar (Get-Item $scoop)

          $sums = $hashes.Keys | Sort-Object | ForEach-Object { "$($hashes[$_])  $_" }
          [IO.File]::WriteAllText((Join-Path $dist 'SHA256SUMS'), ($sums -join "`n") + "`n")
          Get-ChildItem $dist -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Scan with Microsoft Defender
        run: |
          # https://learn.microsoft.com/ja-jp/defender-endpoint/command-line-arguments-microsoft-defender-antivirus
          $defenderPath = "${env:ProgramFiles}/Windows Defender/MpCmdRun.exe"

          Write-Host "Updating Microsoft Defender signatures..."
          & $defenderPath -SignatureUpdate

          Write-Host "Scan packages..."
          $filePath = (Resolve-Path -Path "dist").Path
          & $defenderPath -Scan -ScanType 3 -File $filePath -DisableRemediation

      # The whole output of this job, and the only thing the release job takes
      # from it. On a dry-run this is where the pipeline ends.
      - name: upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: jdk-${{ steps.meta.outputs.version }}-windows
          path: dist
          if-no-files-found: error
          retention-days: 7

  # Signs and publishes. Holds the elevated permissions and runs no cargo:
  # `dist` arrives as an artifact, and the only code executed here is
  # ssh-keygen, the attestation action and gh.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: windows-2025
    permissions:
      contents: write
      # The build-provenance attestation mints its identity from this job's OIDC
      # token. The SSHSIG over SHA256SUMS does not: it uses a long-lived key
      # from a secret, because the client that verifies it has to be able to do
      # so with nothing but a key compiled into itself.
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    steps:
      # For CHANGELOG.md, which becomes the release notes. No build happens on
      # this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: download the built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: jdk-${{ needs.build.outputs.version }}-windows
          path: dist

      # The anchor `jdk update` verifies. `ssh-keygen` is preinstalled on
      # windows-2025, and ed25519 signing is deterministic, so this is ~10
      # lines and no extra action in the supply chain. Both artifacts are
      # mandatory from 0.6.0 on: an updater that meets a release without
      # SHA256SUMS.sig refuses it rather than falling back.
      - name: sign SHA256SUMS (SSHSIG, namespace jdk-release)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # Named, rather than left to fail as a null dereference three lines
          # down: an unset secret is the likeliest thing to go wrong here and
          # the least self-explanatory to read in a log.
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_SIGNING_KEY)) {
            throw "the RELEASE_SIGNING_KEY secret is empty or unset - a release cannot be signed without it"
          }
          $key = Join-Path $env:RUNNER_TEMP 'jdk-release-signing-key'
          try {
            # WriteAllText and not Set-Content or `>`: OpenSSH rejects a key
            # file that picked up CRLF or a BOM on the way to disk, and it
            # wants the final newline the secret may not carry. The CRLF can
            # also come from the secret itself, pasted out of an editor that
            # saved the key with Windows line endings.
            $pem = ($env:RELEASE_SIGNING_KEY -replace "`r`n?", "`n")
            if (-not $pem.EndsWith("`n")) { $pem += "`n" }
            [IO.File]::WriteAllText($key, $pem)
            # ssh-keygen refuses a private key OTHER accounts can read, so
            # `/inheritance:r` — which drops every inherited ACE — is what
            # satisfies it; the right granted back to this one account is not
            # part of that check. Modify and not Read: a delete needs either
            # DELETE on the file or FILE_DELETE_CHILD on its directory, and
            # $RUNNER_TEMP grants neither, so `(R)` left the key undeletable
            # and the finally below could not keep its promise. `(M)` opens
            # nothing to anyone else — the ACL still names one account.
            icacls $key /inheritance:r /grant:r "$(whoami):(M)" | Out-Null
            # ssh-keygen ASKS before overwriting an existing .sig and, with
            # nothing on stdin to answer, keeps the old one and still exits 0 —
            # so a stale signature could ride out with fresh sums.
            Remove-Item dist/SHA256SUMS.sig -Force -ErrorAction SilentlyContinue
            ssh-keygen -Y sign -f $key -n jdk-release dist/SHA256SUMS
          } finally {
            # Off the disk before anything else runs in this job, whatever
            # happened above — and verified, because -ErrorAction
            # SilentlyContinue is equally happy to have deleted nothing. A
            # throw here can mask one from the try block; a private key left
            # on a runner is the worse of the two.
            Remove-Item $key -Force -ErrorAction SilentlyContinue
            if (Test-Path $key) { throw "the release signing key is still at $key - refusing to go on with it on disk" }
          }
          if (-not (Test-Path dist/SHA256SUMS.sig)) {
            throw "ssh-keygen wrote no dist/SHA256SUMS.sig - the release would ship unverifiable"
          }
          Write-Host "signed dist/SHA256SUMS ($((Get-Item dist/SHA256SUMS.sig).Length) bytes)"

      # SLSA build provenance for the release zips, verifiable with
      # `gh attestation verify <zip> --repo isacgalvao/jdk`.
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/jdk-*.zip

      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # Data, not script text — same reason as the assemble step.
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $version = $env:VERSION

          # Release notes are the CHANGELOG section for this version, verbatim.
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$version\]" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md has no '## [$version]' section" }
          $section = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[' -or $lines[$i] -match '^\[.+\]:') { break }
            $section += $lines[$i]
          }
          $changelog = ($section -join "`n").Trim()

          $fence = '```'
          $notes = @"
          $changelog

          ---

          **Install (PowerShell)**

          ${fence}powershell
          irm https://github.com/isacgalvao/jdk/releases/latest/download/install.ps1 | iex
          $fence

          **Verify (optional)**

          ${fence}bash
          # the signature jdk update itself checks, over the checksums of every asset
          echo 'release@jdk namespaces="jdk-release" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKufZs1YJGeiBZsIVZSpxMIR/1hmAu1/biqqKJzgDxu7' > allowed_signers
          ssh-keygen -Y verify -f allowed_signers -I release@jdk -n jdk-release \
            -s SHA256SUMS.sig < SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          # build provenance for a downloaded zip
          gh attestation verify jdk-v$version-windows-x64.zip --repo isacgalvao/jdk
          $fence

          See the [README](https://github.com/isacgalvao/jdk#readme) for the command reference and the full setup.
          "@
          $assets = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME --title "jdk $env:GITHUB_REF_NAME" --notes $notes @assets

  # After a tag's release build/scan and GitHub release succeed, publish the
  # three crates.io crates. One invocation for all three: cargo packages and
  # verifies every crate before uploading any of them, orders them by dependency
  # and waits for each to be indexed — so the window where a later failure can
  # leave the version half published is as narrow as cargo can make it. The dry
  # run in the build job has already walked this exact path.
  #
  # Windows-native so the verification build (jdk-core/jdk are Windows-only)
  # matches the manual publish. The set is named explicitly rather than taken
  # from `--workspace`: jdk-index-gen and test-support are `publish = false` and
  # jdk-shim is not published, and naming them here means a new crate cannot
  # reach crates.io by forgetting a manifest key.
  #
  # `environment: release` is where CARGO_REGISTRY_TOKEN lives (CI-13): a
  # long-lived token that can publish executable code to third parties is the
  # one secret in this repository worth an approval gate and an audit trail of
  # its own, and an environment is the only place Actions offers either.
  publish-crates:
    needs: release
    runs-on: windows-2025
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # rust-toolchain.toml pins the toolchain; rustup auto-installs it on the
      # first cargo call.

      - name: publish to crates.io (jdk-resolve -> jdk-core -> jdk)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p jdk-resolve -p jdk-core -p jdk

  # Opens the winget-pkgs pull request for this version. komac is invoked
  # directly rather than through the `winget-releaser` action, which is a
  # wrapper around this same komac call: pinning that action by SHA — the rule
  # everywhere else in this file — would still leave `cargo-bins/cargo-binstall@main`
  # running inside it at whatever `main` holds that day, in the one job that
  # holds a classic PAT with write access to every public repository this
  # account owns, this one included. A pinned version and a checked hash is
  # the smaller surface and the honest reading of the same rule.
  #
  # A package's FIRST version cannot be submitted this way: `komac update`
  # copies the metadata from the version already in winget-pkgs, so there has
  # to be one. That step is in RELEASING.md, and packaging/winget/ holds the
  # manifest it submits.
  winget:
    needs: [build, release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # The release is already published and signed by the time this runs, and
    # winget-pkgs is a repository nobody here controls. A submission that
    # cannot be made — a missing architecture, a moderation queue, an outage —
    # is a red annotation on a green release, not a failed release.
    continue-on-error: true
    runs-on: windows-2025
    # Nothing here reads this repository through the API — release assets are
    # public files — so the job asks for nothing and the only credential in
    # scope is the PAT below.
    permissions: {}
    defaults:
      run:
        shell: pwsh
    steps:
      # `secrets` cannot be read from a job-level `if`, so the skip is a step
      # that reports what it found. Missing is an ordinary state — every fork
      # sits there, and so does this repository until the package exists in
      # winget-pkgs — which is why it is a notice and not a failure.
      - name: is there a token to submit with
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $present = -not [string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)
          if (-not $present) {
            Write-Host "::notice::WINGET_TOKEN is unset, so nothing was submitted to winget-pkgs. RELEASING.md has the one-time manual submission that comes first, and how to create the secret after it."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "present=$($present.ToString().ToLowerInvariant())"

      - name: submit to winget-pkgs
        if: steps.token.outputs.present == 'true'
        env:
          # komac takes the fork owner and its credential from the environment.
          # The PAT is a classic one scoped `public_repo`: a fine-grained token
          # cannot open a pull request against a repository this account
          # neither owns nor belongs to.
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $komacVersion = '2.16.0'
          $komacSha256 = 'bdc45baf028f750da7519cc8a5f2eab5dfef46dfe88650eeb0d0a9bf51446e4f'
          $komac = Join-Path $env:RUNNER_TEMP 'komac.exe'
          Invoke-WebRequest -UseBasicParsing -OutFile $komac `
            -Uri "https://github.com/russellbanks/Komac/releases/download/v$komacVersion/komac-$komacVersion-x86_64-pc-windows-msvc.exe"
          $actual = (Get-FileHash -Algorithm SHA256 -Path $komac).Hash.ToLowerInvariant()
          if ($actual -ne $komacSha256) {
            throw "komac $komacVersion hashes $actual, expected $komacSha256 - refusing to run it with the submission token in scope"
          }

          # komac maps the URLs it is handed onto the architectures the manifest
          # already in winget-pkgs declares. One URL for a two-architecture
          # package does not yield a one-architecture manifest: komac either
          # refuses the duplicate entry, or writes an arm64 installer pointing
          # at the x64 zip — and a duplicate installer hash is only a warning
          # there, so that second outcome publishes. Hence all or nothing. A
          # version missing from winget-pkgs can be submitted later; a manifest
          # naming the wrong bytes sits in Microsoft's repository until someone
          # notices.
          $version = $env:VERSION
          $missing = @()
          $urls = foreach ($arch in 'x64', 'arm64') {
            $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version/jdk-v$version-windows-$arch.zip"
            try {
              Invoke-WebRequest -UseBasicParsing -Method Head -Uri $url | Out-Null
              $url
            } catch {
              # A 404 is the release not carrying this architecture. Anything
              # else is this runner's problem, and must not be reported below
              # as a fact about the release.
              $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
              if ($status -ne 404) { throw }
              $missing += $arch
            }
          }
          if ($missing) {
            throw "v$version publishes no $($missing -join ' or ') zip, so this version is not going to winget-pkgs: komac would have to guess which architecture the remaining zip answers for. Submit it by hand if it should be there without $($missing -join '/')."
          }

          & $komac update isacgalvao.jdk --version $version --submit --urls $urls
