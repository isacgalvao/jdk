# Keeps dependencies current without surprises. For GitHub Actions, Dependabot
# opens a PR bumping each SHA pin (SHA + `# vN` comment) when a new release
# lands, so the immutable pins never go stale — the security of a SHA with the
# freshness of a tag. Cargo crates are tracked the same way. Each ecosystem's
# updates are batched into one weekly PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  # Cargo splits in two. Patch and minor bumps travel together and are merged
  # by dependabot-automerge.yml once CI passes; a MAJOR gets a PR to itself,
  # because the group with `patterns: "*"` once carried `zip 2.4.2 -> 8.6.0`
  # — six majors of the extraction library — inside a nine-crate PR, where the
  # one bump that needed `extract.rs` read like eight that needed nothing.
  # Anything outside the group is ungrouped, which is what makes majors
  # individual: there is no second group to write.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    commit-message:
      prefix: chore
