[workspace]
resolver = "3"
members = [
    "crates/jdk",
    "crates/jdk-core",
    "crates/jdk-index-gen",
    "crates/jdk-resolve",
    "crates/jdk-shim",
    "crates/test-support",
]

# publish is off by default so an internal crate never leaks to crates.io; the
# three published crates (jdk, jdk-core, jdk-resolve) opt back in explicitly.
[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/isacgalvao/jdk"
publish = false

# The internal crates, declared once so a release bumps one place. `version` is
# the requirement cargo bakes into the published manifests, and cargo has no way
# to inherit the package version into a dependency requirement — so it repeats
# the version above. Forgetting it is not a silent drift: the path dependency no
# longer satisfies the requirement and every `cargo check` fails to resolve.
[workspace.dependencies]
jdk-core = { path = "crates/jdk-core", version = "0.4.0" }
jdk-resolve = { path = "crates/jdk-resolve", version = "0.4.0" }
# Dev-only and never published, so it carries no requirement to keep in step.
test-support = { path = "crates/test-support" }

# Size-optimized profile for the shim, which is copied byte-identically once
# per JDK tool — so every byte counts.
[profile.release-shim]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"  # Optimize for size
panic = "abort"  # Smaller binary without unwinding
strip = true  # Strip symbols
