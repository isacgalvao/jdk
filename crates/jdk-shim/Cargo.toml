[package]
name = "jdk-shim"
description = "Per-tool .exe shim: resolves the pinned JDK and delegates; deployed as byte-identical copies named java.exe, javac.exe, ..."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Firewall: only jdk-resolve (std-only) and the Win32 bindings. No network,
# no async, no parsers beyond jdk-resolve.
[dependencies]
jdk-resolve.workspace = true
# The workspace entry carries no features, so this list is the whole surface:
# the firewall is what is written here.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

# Dev-only (the runtime firewall above is untouched): the auto-install e2e
# serves a loopback catalog and drives the real jdk.exe.
[dev-dependencies]
tempfile.workspace = true
test-support.workspace = true
